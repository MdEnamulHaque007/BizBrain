# Deploy Flutter Web to Firebase Hosting (free-tier compatible)
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web version marker
        run: |
          echo "${GITHUB_SHA}" > web/version.txt
          sed -i "s/__BIZBRAIN_BUILD_VERSION__/${GITHUB_SHA}/g" web/index.html
      - run: flutter pub get && flutter build web --release --pwa-strategy=none
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIZBRAIN_E3A61 }}
          channelId: live
          projectId: bizbrain-e3a61
